[mod]
id = "roast"
version = "0.3.0"
priority = 100

[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

# Roast's pure logic (definitions and click decisions), compiled into the game beside the hooks.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "roast"
source = "runtime.rs"

# Right-click on a feast, cake or display.
[[injection]]
id = "click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# A placeable item set down as a block.
[[injection]]
id = "use_item"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "entity.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update_tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<Compound>", value = "&mut *tag" },
]

[[injection]]
id = "submit"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]
